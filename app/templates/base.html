<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablón de Anuncios</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Menú de Navegación e インターフェース -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">Tablón Institucional</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('anuncios.listar') }}">Anuncios</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('categorias.listar') }}">Categorías</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('usuarios.listar') }}">Usuarios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Área de Contenido Principal -->
    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de Página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p>&copy; 2026 - Tecnologías Emergentes II</p>
    </footer>
</body>
</html>
